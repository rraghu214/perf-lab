# Activated by -Dspring.profiles.active=datadog when DATADOG_API_KEY is set.
# The hook sources ~/perflab.env and adds this profile when the key is present.
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.api-key=${DATADOG_API_KEY}
management.datadog.metrics.export.uri=${DATADOG_SITE_URI:https://api.datadoghq.com}
management.datadog.metrics.export.step=10s
management.datadog.metrics.export.descriptions=false
